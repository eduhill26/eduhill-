<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EduHill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B2340;
    --bg-soft:#242D52;
    --bg-softer:#2E3861;
    --paper:#FAF6EC;
    --paper-alt:#F1E7D2;
    --ink:#241E15;
    --ink-soft:#6B6656;
    --amber:#E8A33D;
    --amber-deep:#C97F1E;
    --amber-ink:#241A08;
    --teal:#3F9C7B;
    --teal-bg:#E3F3EC;
    --teal-ink:#1D5C46;
    --terracotta:#C75C4A;
    --terracotta-bg:#F7E7E3;
    --terracotta-ink:#7A2E21;
    --cream:#F3EFE3;
    --border:#E3D9C2;
    --radius-card:14px;
    --radius-pill:999px;
    --shadow-card:0 2px 10px rgba(27,35,64,0.16);
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; min-height:100%; }
  body{
    background:var(--bg);
    color:var(--cream);
    font-family:'Hind', 'Noto Sans Devanagari', sans-serif;
    line-height:1.5;
  }
  h1,h2,h3,.q-badge,.mode-btn,.tab-btn{ font-family:'Tiro Devanagari Hindi','Hind',serif; }
  .app-container{ max-width:640px; margin:0 auto; padding:1.25rem 1rem 3rem; }

  .app-header{
    display:flex; align-items:center; gap:.8rem; padding:.5rem 0 1.1rem;
    animation:fadeInDown .5s ease-out;
  }
  @keyframes fadeInDown{ from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);} }
  .app-header h1{ margin:0; font-size:1.7rem; letter-spacing:.3px; }
  .app-header .tagline{ margin:.15rem 0 0; font-size:.88rem; color:rgba(243,239,227,.72); }

  .tab-nav{ display:flex; gap:.4rem; border-bottom:1px solid rgba(255,255,255,.15); margin-bottom:1.2rem; }
  .tab-btn{
    background:none; border:none; color:var(--cream); opacity:.55; cursor:pointer;
    padding:.7rem 1rem; font-size:1.02rem; border-bottom:3px solid transparent;
    transition:opacity .15s, border-color .15s;
  }
  .tab-btn.active{ opacity:1; border-color:var(--amber); color:var(--amber); }
  .tab-btn:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--amber); outline-offset:2px;
  }

  .card{
    background:var(--paper); color:var(--ink); border-radius:var(--radius-card);
    padding:1.1rem 1.15rem; box-shadow:var(--shadow-card); margin-bottom:1rem;
  }
  .form-card h2{ margin:0 0 .2rem; font-size:1.12rem; }
  .field-label{ display:block; font-size:.8rem; font-weight:600; color:var(--ink-soft); margin:.7rem 0 .3rem; }

  input[type="date"], input[type="text"], textarea{
    width:100%; padding:.6rem .7rem; border:1px solid var(--border); border-radius:9px;
    font-family:'Hind',sans-serif; font-size:.96rem; background:#fff; color:var(--ink); margin-bottom:.3rem;
  }
  textarea{ resize:vertical; }

  button{ font-family:'Hind',sans-serif; cursor:pointer; border:none; border-radius:var(--radius-pill); }
  .btn-primary{ background:var(--amber); color:var(--amber-ink); font-weight:700; padding:.65rem 1.3rem; font-size:.95rem; transition:background .15s; }
  .btn-primary:hover{ background:var(--amber-deep); }
  .btn-secondary{ background:var(--teal); color:#fff; font-weight:700; padding:.65rem 1.3rem; font-size:.95rem; }
  .btn-ghost{ background:transparent; border:1px solid var(--border); color:var(--ink); padding:.5rem 1rem; font-size:.88rem; }
  .btn-ghost-danger{ background:transparent; border:1px solid var(--terracotta); color:var(--terracotta); padding:.5rem 1rem; font-size:.88rem; }
  .btn-danger{ background:var(--terracotta); color:#fff; font-weight:700; padding:.6rem 1.2rem; font-size:.9rem; }
  .btn-block{ width:100%; margin-top:.6rem; }
  .btn-block-outline{ width:100%; margin-top:.3rem; text-align:center; }
  .form-actions{ display:flex; gap:.6rem; margin-top:.7rem; flex-wrap:wrap; }

  .meta-line{ color:rgba(243,239,227,.68); font-size:.85rem; margin:0 0 .7rem; }

  .date-heading{ font-size:1rem; color:var(--cream); margin:1.3rem 0 .5rem; padding-bottom:.3rem; border-bottom:1px solid rgba(255,255,255,.15); }
  .date-group:first-of-type .date-heading{ margin-top:0; }
  .note-card{ border-left:4px solid var(--amber); }
  .note-card.editing{ border-left-color:var(--teal); }
  .note-text{ white-space:pre-wrap; margin:0 0 .7rem; }
  .note-actions{ display:flex; gap:.5rem; justify-content:flex-end; }

  .quiz-mode-switch{ display:flex; gap:.5rem; margin-bottom:1rem; }
  .mode-btn{
    flex:1; padding:.6rem .5rem; background:var(--bg-soft); color:var(--cream);
    border:1px solid rgba(255,255,255,.15); border-radius:var(--radius-pill); opacity:.65; font-size:.92rem;
    transition:opacity .15s, background .15s;
  }
  .mode-btn.active{ opacity:1; background:var(--amber); color:var(--amber-ink); border-color:var(--amber); }

  .manage-toolbar{ display:flex; gap:.6rem; flex-wrap:wrap; justify-content:space-between; align-items:center; margin-bottom:.6rem; }

  .quiz-card-head{ display:flex; align-items:flex-start; gap:.6rem; margin-bottom:.8rem; }
  .q-badge{
    flex-shrink:0; width:28px; height:28px; border-radius:50%; background:var(--amber); color:var(--amber-ink);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.9rem;
  }
  .q-text{ font-weight:600; line-height:1.45; margin:.1rem 0 0; }

  .option-row{
    display:flex; align-items:center; gap:.6rem; padding:.55rem .7rem; border:1px solid var(--border);
    border-radius:10px; margin-bottom:.5rem; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .option-row:hover{ border-color:var(--amber); }
  .option-row:has(input:checked){ border-color:var(--amber); background:var(--paper-alt); }
  .option-row input[type="radio"]{ accent-color:var(--amber); width:18px; height:18px; flex-shrink:0; }
  .option-text{ font-size:.95rem; }

  .result-option{
    display:flex; align-items:center; gap:.55rem; padding:.5rem .7rem; border:1px solid var(--border);
    border-radius:10px; margin-bottom:.4rem; font-size:.93rem;
  }
  .result-option.correct{ border-color:var(--teal); background:var(--teal-bg); color:var(--teal-ink); }
  .result-option.wrong{ border-color:var(--terracotta); background:var(--terracotta-bg); color:var(--terracotta-ink); }
  .opt-mark{ width:16px; flex-shrink:0; text-align:center; font-weight:700; }

  .explanation{ margin-top:.85rem; padding-top:.7rem; border-top:1px dashed var(--border); }
  .explanation-label{ font-size:.78rem; font-weight:700; color:var(--ink-soft); margin:0 0 .25rem; }
  .explanation p:last-child{ margin:0; line-height:1.55; }

  .score-banner{ text-align:center; padding:1.5rem 1rem; }
  .score-num{ font-family:'Tiro Devanagari Hindi',serif; font-size:2.6rem; font-weight:700; color:var(--amber-deep); animation:popIn .4s ease-out; }
  @keyframes popIn{ from{ transform:scale(.7); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .score-label{ margin:.4rem 0 1rem; color:var(--ink-soft); }

  .option-input-row{ display:flex; align-items:center; gap:.55rem; margin-bottom:.5rem; }
  .option-input-row input[type="text"]{ flex:1; margin-bottom:0; }
  .option-input-row input[type="radio"]{ accent-color:var(--amber); width:18px; height:18px; flex-shrink:0; }

  .confirm-banner{ border:1px solid var(--terracotta); }
  .confirm-banner p{ margin:0 0 .5rem; font-weight:600; }

  .empty-state{ text-align:center; color:var(--ink-soft); padding:2rem 1rem; }

  .toast{
    position:fixed; bottom:1.2rem; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--cream); padding:.6rem 1.1rem; border-radius:var(--radius-pill);
    font-size:.88rem; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
    box-shadow:0 4px 14px rgba(0,0,0,.35); z-index:50; max-width:90%; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  .loading{ text-align:center; padding:3.5rem 1rem; color:var(--cream); }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
  @media (max-width:400px){
    .app-container{ padding:1rem .75rem 2.5rem; }
    .score-num{ font-size:2.2rem; }
  }
</style>
</head>
<body>
  <div class="app-container">
    <div id="app-root"></div>
  </div>
  <div id="toast" class="toast"></div>

<script>
(function(){
  "use strict";

  var HILL_SVG = '<svg width="48" height="48" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    '<path d="M2 40 L18 16 L28 30 L36 18 L50 40 Z" fill="#2E3861"/>' +
    '<path d="M2 40 L14 22 L24 34 L34 20 L50 40 Z" fill="#3A4570"/>' +
    '<path d="M34 20 L34 8" stroke="#E8A33D" stroke-width="2" stroke-linecap="round"/>' +
    '<path d="M34 8 L44 12 L34 16 Z" fill="#E8A33D"/>' +
    '</svg>';

  var DEFAULT_QUESTIONS = [
    {
      id: 'q1',
      question: 'भारत की राजधानी क्या है?',
      options: ['मुंबई', 'नई दिल्ली', 'कोलकाता', 'चेन्नई'],
      correctIndex: 1,
      explanation: 'नई दिल्ली भारत की राजधानी है। इसे 1911 में ब्रिटिश शासन के दौरान राजधानी बनाया गया और 1947 की स्वतंत्रता के बाद भी यह दर्जा बरकरार रहा।'
    },
    {
      id: 'q2',
      question: 'महात्मा गांधी का जन्म किस वर्ष हुआ था?',
      options: ['1869', '1875', '1885', '1900'],
      correctIndex: 0,
      explanation: 'महात्मा गांधी का जन्म 2 अक्टूबर 1869 को पोरबंदर, गुजरात में हुआ था।'
    },
    {
      id: 'q3',
      question: 'भारत का राष्ट्रीय पशु कौन सा है?',
      options: ['शेर', 'हाथी', 'बाघ', 'चीता'],
      correctIndex: 2,
      explanation: 'बाघ (बंगाल टाइगर) को 1973 में भारत का राष्ट्रीय पशु घोषित किया गया था।'
    },
    {
      id: 'q4',
      question: 'सूर्य से सबसे नज़दीक ग्रह कौन सा है?',
      options: ['शुक्र', 'बुध', 'पृथ्वी', 'मंगल'],
      correctIndex: 1,
      explanation: 'बुध ग्रह सूर्य से सबसे नज़दीक है, जिसकी दूरी लगभग 5.8 करोड़ किलोमीटर है।'
    },
    {
      id: 'q5',
      question: 'भारतीय संविधान कब लागू हुआ था?',
      options: ['15 अगस्त 1947', '26 जनवरी 1950', '26 नवंबर 1949', '2 अक्टूबर 1950'],
      correctIndex: 1,
      explanation: 'भारतीय संविधान 26 नवंबर 1949 को अपनाया गया, लेकिन यह 26 जनवरी 1950 को लागू हुआ — इसी कारण यह दिन गणतंत्र दिवस के रूप में मनाया जाता है।'
    }
  ];

  // ---------- Cloudflare Worker API config ----------
  // Worker deploy करने के बाद ये दोनों वैल्यू यहीं बदलें:
  //   API_BASE -> `wrangler deploy` से मिला आपका Worker URL
  //   API_KEY  -> वही key जो आपने `wrangler secret put API_KEY` में डाली थी
  var API_BASE = 'https://eduhill.eduhill26.workers.dev';
  var API_KEY = 'CPWD8lvUYBa2XnBaG13lR02gV_awqNxeOtlcZkpOw_E';
  var API_CONFIGURED = API_BASE.indexOf('YOUR-SUBDOMAIN') === -1 && API_KEY !== 'PASTE_YOUR_API_KEY_HERE';

  async function apiRequest(path, options){
    var opts = options || {};
    var headers = Object.assign({ 'Authorization': 'Bearer ' + API_KEY }, opts.headers || {});
    var res = await fetch(API_BASE + path, Object.assign({}, opts, { headers: headers }));
    if (!res.ok) {
      var errText = '';
      try { var errJson = await res.json(); errText = errJson.error || ''; } catch(e){}
      throw new Error('API ' + res.status + (errText ? (': ' + errText) : ''));
    }
    return res.json();
  }

  var state = {
    loading: true,
    setupNeeded: false,
    activeTab: 'notes',
    notes: [],
    questions: [],
    editingNoteId: null,
    quizMode: 'take',
    editingQuestionId: null,
    answers: {},
    submitted: false,
    pendingConfirm: null
  };

  function escapeHtml(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function genId(prefix){
    return prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  }

  function todayStr(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function yesterdayStr(){
    var d = new Date();
    d.setDate(d.getDate()-1);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function formatDateHindi(dateStr){
    var months = ['जनवरी','फरवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितंबर','अक्टूबर','नवंबर','दिसंबर'];
    var parts = dateStr.split('-').map(Number);
    var y = parts[0], m = parts[1], d = parts[2];
    return d + ' ' + months[m-1] + ' ' + y;
  }

  function dateGroupLabel(dateStr){
    var formatted = formatDateHindi(dateStr);
    if (dateStr === todayStr()) return 'आज (' + formatted + ')';
    if (dateStr === yesterdayStr()) return 'कल (' + formatted + ')';
    return formatted;
  }

  function groupNotesByDate(notes){
    var groups = {};
    notes.forEach(function(n){
      if (!groups[n.date]) groups[n.date] = [];
      groups[n.date].push(n);
    });
    var dates = Object.keys(groups).sort(function(a,b){ return b.localeCompare(a); });
    dates.forEach(function(d){ groups[d].sort(function(a,b){ return b.createdAt - a.createdAt; }); });
    return dates.map(function(d){ return { date: d, items: groups[d] }; });
  }

  var toastTimer = null;
  function showToast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
  }

  // ---------- storage (Cloudflare Worker + KV) ----------
  async function saveNotes(){
    try {
      await apiRequest('/api/notes', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(state.notes)
      });
    } catch(e){ console.error('notes save error', e); showToast('नोट्स सेव करने में समस्या हुई - Worker/इंटरनेट जांचें'); }
  }

  async function saveQuestions(){
    try {
      await apiRequest('/api/questions', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(state.questions)
      });
    } catch(e){ console.error('questions save error', e); showToast('प्रश्न सेव करने में समस्या हुई - Worker/इंटरनेट जांचें'); }
  }

  async function loadAll(){
    state.loading = true;
    render();

    if (!API_CONFIGURED) {
      // Worker URL/key अभी सेट नहीं हुए - सेटअप स्क्रीन दिखाएं।
      state.notes = [];
      state.questions = DEFAULT_QUESTIONS.map(function(q){ return Object.assign({}, q); });
      state.loading = false;
      state.setupNeeded = true;
      render();
      return;
    }

    try {
      var data = await apiRequest('/api/data', { method: 'GET' });
      state.notes = Array.isArray(data.notes) ? data.notes : [];
      if (Array.isArray(data.questions) && data.questions.length) {
        state.questions = data.questions;
      } else {
        state.questions = DEFAULT_QUESTIONS.map(function(q){ return Object.assign({}, q); });
        await saveQuestions();
      }
    } catch(e){
      console.error('load error', e);
      showToast('डेटा लोड नहीं हो पाया - Worker URL/key जांचें');
      state.notes = [];
      state.questions = DEFAULT_QUESTIONS.map(function(q){ return Object.assign({}, q); });
    }

    state.loading = false;
    render();
  }

  // ---------- notes handlers ----------
  async function handleSaveNote(){
    var dateEl = document.getElementById('note-date');
    var textEl = document.getElementById('note-text');
    var dateVal = (dateEl && dateEl.value) ? dateEl.value : todayStr();
    var textVal = textEl ? textEl.value.trim() : '';
    if (!textVal) { showToast('कृपया नोट में कुछ लिखें'); return; }
    state.notes.push({ id: genId('n'), date: dateVal, text: textVal, createdAt: Date.now() });
    await saveNotes();
    showToast('नोट सेव हो गया');
    render();
  }

  function handleEditNote(id){ state.editingNoteId = id; render(); }
  function handleCancelEditNote(){ state.editingNoteId = null; render(); }

  async function handleSaveEditedNote(id){
    var dateEl = document.getElementById('edit-note-date-' + id);
    var textEl = document.getElementById('edit-note-text-' + id);
    var textVal = textEl ? textEl.value.trim() : '';
    if (!textVal) { showToast('कृपया नोट में कुछ लिखें'); return; }
    var n = state.notes.find(function(n){ return n.id === id; });
    if (n) {
      n.date = (dateEl && dateEl.value) ? dateEl.value : n.date;
      n.text = textVal;
    }
    await saveNotes();
    state.editingNoteId = null;
    showToast('नोट अपडेट हो गया');
    render();
  }

  async function handleDeleteNote(id){
    state.notes = state.notes.filter(function(n){ return n.id !== id; });
    await saveNotes();
    showToast('नोट हटा दिया गया');
    render();
  }

  async function handleDeleteAllNotes(){
    state.notes = [];
    await saveNotes();
    showToast('सभी नोट्स हटा दिए गए');
    render();
  }

  // ---------- quiz take handlers ----------
  function handleSubmitQuiz(){
    var answers = {};
    var unanswered = [];
    state.questions.forEach(function(q){
      var checked = document.querySelector('input[name="q_' + q.id + '"]:checked');
      if (checked) answers[q.id] = Number(checked.value);
      else unanswered.push(q.id);
    });
    if (unanswered.length > 0) { showToast('कृपया सभी प्रश्नों के उत्तर चुनें'); return; }
    state.answers = answers;
    state.submitted = true;
    render();
  }

  function handleRetryQuiz(){
    state.submitted = false;
    state.answers = {};
    render();
  }

  function handleSwitchQuizMode(mode){
    state.quizMode = mode;
    state.editingQuestionId = null;
    render();
  }

  // ---------- quiz manage handlers ----------
  function handleOpenAddQuestion(){
    state.editingQuestionId = null;
    state.quizMode = 'form';
    render();
  }

  function handleOpenEditQuestion(id){
    state.editingQuestionId = id;
    state.quizMode = 'form';
    render();
  }

  function handleCancelQuestionForm(){
    state.editingQuestionId = null;
    state.quizMode = 'list';
    render();
  }

  async function handleSaveQuestionForm(){
    var questionEl = document.getElementById('qf-question');
    var explanationEl = document.getElementById('qf-explanation');
    var question = questionEl ? questionEl.value.trim() : '';
    var options = [0,1,2,3].map(function(i){
      var el = document.getElementById('qf-option-' + i);
      return el ? el.value.trim() : '';
    });
    var correctRadio = document.querySelector('input[name="qf-correct"]:checked');
    var explanation = explanationEl ? explanationEl.value.trim() : '';

    if (!question || options.some(function(o){ return !o; }) || !correctRadio) {
      showToast('कृपया सभी फ़ील्ड भरें और सही उत्तर चुनें');
      return;
    }

    var correctIndex = Number(correctRadio.value);
    if (state.editingQuestionId) {
      var q = state.questions.find(function(q){ return q.id === state.editingQuestionId; });
      if (q) {
        q.question = question; q.options = options; q.correctIndex = correctIndex; q.explanation = explanation;
      }
    } else {
      state.questions.push({ id: genId('q'), question: question, options: options, correctIndex: correctIndex, explanation: explanation });
    }
    await saveQuestions();
    state.editingQuestionId = null;
    state.quizMode = 'list';
    showToast('प्रश्न सेव हो गया');
    render();
  }

  async function handleDeleteQuestion(id){
    state.questions = state.questions.filter(function(q){ return q.id !== id; });
    await saveQuestions();
    showToast('प्रश्न हटा दिया गया');
    render();
  }

  async function handleResetQuestions(){
    state.questions = DEFAULT_QUESTIONS.map(function(q){ return Object.assign({}, q); });
    await saveQuestions();
    showToast('डिफ़ॉल्ट प्रश्न वापस आ गए');
    render();
  }

  function handleConfirmYes(){
    var type = state.pendingConfirm;
    state.pendingConfirm = null;
    if (type === 'delete-all-notes') handleDeleteAllNotes();
    else if (type === 'reset-questions') handleResetQuestions();
    else render();
  }

  // ---------- rendering ----------
  function renderConfirmBanner(){
    if (!state.pendingConfirm) return '';
    var messages = {
      'delete-all-notes': 'क्या आप वाकई सभी नोट्स हमेशा के लिए हटाना चाहते हैं?',
      'reset-questions': 'क्या आप सभी प्रश्नों को हटाकर डिफ़ॉल्ट 5 प्रश्नों पर वापस जाना चाहते हैं?'
    };
    return '<div class="card confirm-banner">' +
      '<p>' + messages[state.pendingConfirm] + '</p>' +
      '<div class="form-actions">' +
        '<button class="btn-danger" data-action="confirm-yes">हां, आगे बढ़ें</button>' +
        '<button class="btn-ghost" data-action="confirm-no">रद्द करें</button>' +
      '</div>' +
    '</div>';
  }

  function renderNoteItem(n){
    if (state.editingNoteId === n.id) {
      return '<div class="card note-card editing">' +
        '<input type="date" id="edit-note-date-' + n.id + '" value="' + n.date + '" />' +
        '<textarea id="edit-note-text-' + n.id + '" rows="3">' + escapeHtml(n.text) + '</textarea>' +
        '<div class="form-actions">' +
          '<button class="btn-primary" data-action="save-edited-note" data-id="' + n.id + '">सेव करें</button>' +
          '<button class="btn-ghost" data-action="cancel-edit-note">रद्द करें</button>' +
        '</div>' +
      '</div>';
    }
    return '<div class="card note-card">' +
      '<p class="note-text">' + escapeHtml(n.text) + '</p>' +
      '<div class="note-actions">' +
        '<button class="btn-ghost" data-action="edit-note" data-id="' + n.id + '">संपादित करें</button>' +
        '<button class="btn-ghost-danger" data-action="delete-note" data-id="' + n.id + '">हटाएं</button>' +
      '</div>' +
    '</div>';
  }

  function renderNotesTab(){
    var groups = groupNotesByDate(state.notes);
    var html = '';
    html += (state.pendingConfirm ? renderConfirmBanner() : '');
    html += '<div class="card form-card">' +
      '<h2>नया नोट लिखें</h2>' +
      '<label class="field-label">तारीख</label>' +
      '<input type="date" id="note-date" value="' + todayStr() + '" />' +
      '<label class="field-label">नोट</label>' +
      '<textarea id="note-text" rows="4" placeholder="आज आपने क्या सीखा? यहाँ लिखें..."></textarea>' +
      '<div class="form-actions">' +
        '<button class="btn-primary" data-action="save-note">सेव करें</button>' +
      '</div>' +
    '</div>';

    if (groups.length === 0) {
      html += '<div class="card empty-state">अभी कोई नोट नहीं है। ऊपर लिखना शुरू करें।</div>';
    } else {
      html += '<p class="meta-line">कुल ' + state.notes.length + ' नोट्स सेव हैं</p>';
      groups.forEach(function(g){
        html += '<div class="date-group">' +
          '<h3 class="date-heading">' + dateGroupLabel(g.date) + '</h3>' +
          g.items.map(renderNoteItem).join('') +
        '</div>';
      });
      html += '<button class="btn-ghost-danger btn-block-outline" data-action="delete-all-notes">सभी नोट्स हटाएं</button>';
    }
    return html;
  }

  function renderQuestionTake(q, idx){
    var optionsHtml = q.options.map(function(opt, oi){
      return '<label class="option-row">' +
        '<input type="radio" name="q_' + q.id + '" value="' + oi + '" />' +
        '<span class="option-text">' + escapeHtml(opt) + '</span>' +
      '</label>';
    }).join('');
    return '<div class="card">' +
      '<div class="quiz-card-head">' +
        '<span class="q-badge">' + (idx+1) + '</span>' +
        '<p class="q-text">' + escapeHtml(q.question) + '</p>' +
      '</div>' +
      '<div class="q-options">' + optionsHtml + '</div>' +
    '</div>';
  }

  function renderQuizResults(){
    var total = state.questions.length;
    var score = 0;
    state.questions.forEach(function(q){ if (state.answers[q.id] === q.correctIndex) score++; });

    var rows = state.questions.map(function(q, idx){
      var userAns = state.answers[q.id];
      var isCorrect = userAns === q.correctIndex;
      var optionsHtml = q.options.map(function(opt, oi){
        var cls = 'result-option';
        var mark = '';
        if (oi === q.correctIndex) { cls += ' correct'; mark = '✓'; }
        else if (oi === userAns) { cls += ' wrong'; mark = '✗'; }
        return '<div class="' + cls + '"><span class="opt-mark">' + mark + '</span><span>' + escapeHtml(opt) + '</span></div>';
      }).join('');
      return '<div class="card">' +
        '<div class="quiz-card-head">' +
          '<span class="q-badge">' + (idx+1) + '</span>' +
          '<p class="q-text">' + escapeHtml(q.question) + '</p>' +
        '</div>' +
        '<div class="q-options">' + optionsHtml + '</div>' +
        '<div class="explanation">' +
          '<p class="explanation-label">व्याख्या</p>' +
          '<p>' + escapeHtml(q.explanation || 'कोई व्याख्या उपलब्ध नहीं है।') + '</p>' +
        '</div>' +
      '</div>';
    }).join('');

    var label = score === total ? 'शानदार! सभी उत्तर सही हैं 🎉' :
      (score >= Math.ceil(total/2) ? 'अच्छा प्रयास रहा!' : 'फिर से अभ्यास करें, आप बेहतर कर सकते हैं');

    return '<div class="card score-banner">' +
      '<div class="score-num">' + score + '/' + total + '</div>' +
      '<p class="score-label">' + label + '</p>' +
      '<button class="btn-secondary" data-action="retry-quiz">फिर से प्रयास करें</button>' +
    '</div>' + rows;
  }

  function renderQuizTake(){
    if (state.questions.length === 0) {
      return '<div class="card empty-state">कोई प्रश्न उपलब्ध नहीं है। "प्रश्न प्रबंधित करें" में जाकर नया प्रश्न जोड़ें।</div>';
    }
    if (state.submitted) return renderQuizResults();
    return '<form id="quiz-form">' +
      state.questions.map(renderQuestionTake).join('') +
      '<button type="button" class="btn-primary btn-block" data-action="submit-quiz">सबमिट करें</button>' +
    '</form>';
  }

  function renderQuestionForm(){
    var editing = state.editingQuestionId ? state.questions.find(function(q){ return q.id === state.editingQuestionId; }) : null;
    var q = editing || { question:'', options:['','','',''], correctIndex:0, explanation:'' };
    var optionRows = [0,1,2,3].map(function(i){
      return '<div class="option-input-row">' +
        '<input type="radio" name="qf-correct" value="' + i + '" ' + (q.correctIndex===i ? 'checked' : '') + ' />' +
        '<input type="text" id="qf-option-' + i + '" placeholder="विकल्प ' + (i+1) + '" value="' + escapeHtml(q.options[i] || '') + '" />' +
      '</div>';
    }).join('');

    return '<div class="card form-card">' +
      '<h2>' + (editing ? 'प्रश्न संपादित करें' : 'नया प्रश्न जोड़ें') + '</h2>' +
      '<label class="field-label">प्रश्न</label>' +
      '<textarea id="qf-question" rows="2" placeholder="प्रश्न यहाँ लिखें...">' + escapeHtml(q.question) + '</textarea>' +
      '<label class="field-label">विकल्प (सही उत्तर के आगे गोला चुनें)</label>' +
      optionRows +
      '<label class="field-label">व्याख्या (उत्तर के बाद दिखेगी)</label>' +
      '<textarea id="qf-explanation" rows="3" placeholder="सही उत्तर की व्याख्या लिखें...">' + escapeHtml(q.explanation) + '</textarea>' +
      '<div class="form-actions">' +
        '<button class="btn-primary" data-action="save-question-form">सेव करें</button>' +
        '<button class="btn-ghost" data-action="cancel-question-form">रद्द करें</button>' +
      '</div>' +
    '</div>';
  }

  function renderQuizManageList(){
    var html = '<div class="manage-toolbar">' +
      '<button class="btn-primary" data-action="add-question-open">+ नया प्रश्न जोड़ें</button>' +
      (state.questions.length ? '<button class="btn-ghost-danger" data-action="reset-questions">डिफ़ॉल्ट पर रीसेट करें</button>' : '') +
    '</div>';

    if (state.questions.length === 0) {
      html += '<div class="card empty-state">अभी कोई प्रश्न नहीं है। ऊपर बटन से नया प्रश्न जोड़ें।</div>';
      return html;
    }

    html += '<p class="meta-line">कुल ' + state.questions.length + ' प्रश्न</p>';
    html += state.questions.map(function(q, idx){
      var optionsHtml = q.options.map(function(opt, oi){
        var cls = 'result-option' + (oi === q.correctIndex ? ' correct' : '');
        var mark = oi === q.correctIndex ? '✓' : '';
        return '<div class="' + cls + '"><span class="opt-mark">' + mark + '</span><span>' + escapeHtml(opt) + '</span></div>';
      }).join('');
      return '<div class="card">' +
        '<div class="quiz-card-head">' +
          '<span class="q-badge">' + (idx+1) + '</span>' +
          '<p class="q-text">' + escapeHtml(q.question) + '</p>' +
        '</div>' +
        '<div class="q-options">' + optionsHtml + '</div>' +
        '<div class="form-actions">' +
          '<button class="btn-ghost" data-action="edit-question" data-id="' + q.id + '">संपादित करें</button>' +
          '<button class="btn-ghost-danger" data-action="delete-question" data-id="' + q.id + '">हटाएं</button>' +
        '</div>' +
      '</div>';
    }).join('');
    return html;
  }

  function renderQuizSection(){
    var html = '<div class="quiz-mode-switch">' +
      '<button class="mode-btn ' + (state.quizMode === 'take' ? 'active' : '') + '" data-action="switch-quiz-mode" data-mode="take">क्विज़ लें</button>' +
      '<button class="mode-btn ' + (state.quizMode !== 'take' ? 'active' : '') + '" data-action="switch-quiz-mode" data-mode="list">प्रश्न प्रबंधित करें</button>' +
    '</div>';
    html += (state.pendingConfirm ? renderConfirmBanner() : '');
    if (state.quizMode === 'form') html += renderQuestionForm();
    else if (state.quizMode === 'list') html += renderQuizManageList();
    else html += renderQuizTake();
    return html;
  }

  function render(){
    var root = document.getElementById('app-root');
    if (state.loading) {
      root.innerHTML = '<div class="app-header">' + HILL_SVG +
        '<div class="header-text"><h1>EduHill</h1><p class="tagline">पढ़ो, याद रखो, आगे बढ़ो</p></div></div>' +
        '<div class="loading">लोड हो रहा है...</div>';
      return;
    }
    if (state.setupNeeded) {
      root.innerHTML = '<div class="app-header">' + HILL_SVG +
        '<div class="header-text"><h1>EduHill</h1><p class="tagline">पढ़ो, याद रखो, आगे बढ़ो</p></div></div>' +
        '<div class="card">' +
          '<h2>एक आखिरी सेटअप स्टेप बाकी है</h2>' +
          '<p>यह ऐप अब आपके Cloudflare Worker से जुड़ने के लिए तैयार है, लेकिन इस फाइल के ऊपरी हिस्से में <code>API_BASE</code> और <code>API_KEY</code> अभी भी placeholder वैल्यू पर हैं।</p>' +
          '<p>Worker डिप्लॉय करने के बाद इस HTML फाइल में वो दो लाइनें अपनी असली वैल्यू से बदलें, फिर पेज रीलोड करें।</p>' +
        '</div>';
      return;
    }
    var html = '<div class="app-header">' + HILL_SVG +
      '<div class="header-text"><h1>EduHill</h1><p class="tagline">पढ़ो, याद रखो, आगे बढ़ो</p></div></div>';
    html += '<nav class="tab-nav">' +
      '<button class="tab-btn ' + (state.activeTab === 'notes' ? 'active' : '') + '" data-action="switch-tab" data-tab="notes">नोट्स</button>' +
      '<button class="tab-btn ' + (state.activeTab === 'quiz' ? 'active' : '') + '" data-action="switch-tab" data-tab="quiz">क्विज़</button>' +
    '</nav>';
    html += '<main>' + (state.activeTab === 'notes' ? renderNotesTab() : renderQuizSection()) + '</main>';
    root.innerHTML = html;
  }

  // ---------- event delegation ----------
  document.addEventListener('click', function(e){
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var action = btn.dataset.action;
    var id = btn.dataset.id;

    switch(action){
      case 'switch-tab':
        state.activeTab = btn.dataset.tab;
        render();
        break;
      case 'save-note': handleSaveNote(); break;
      case 'edit-note': handleEditNote(id); break;
      case 'cancel-edit-note': handleCancelEditNote(); break;
      case 'save-edited-note': handleSaveEditedNote(id); break;
      case 'delete-note': handleDeleteNote(id); break;
      case 'delete-all-notes': state.pendingConfirm = 'delete-all-notes'; render(); break;
      case 'switch-quiz-mode': handleSwitchQuizMode(btn.dataset.mode); break;
      case 'submit-quiz': handleSubmitQuiz(); break;
      case 'retry-quiz': handleRetryQuiz(); break;
      case 'add-question-open': handleOpenAddQuestion(); break;
      case 'edit-question': handleOpenEditQuestion(id); break;
      case 'cancel-question-form': handleCancelQuestionForm(); break;
      case 'save-question-form': handleSaveQuestionForm(); break;
      case 'delete-question': handleDeleteQuestion(id); break;
      case 'reset-questions': state.pendingConfirm = 'reset-questions'; render(); break;
      case 'confirm-yes': handleConfirmYes(); break;
      case 'confirm-no': state.pendingConfirm = null; render(); break;
    }
  });

  loadAll();
})();
</script>
</body>
</html>
